name: financial-data-assurance-reconciliation-platform

services:
  postgres:
    image: postgres:16
    container_name: fdar-postgres
    environment:
      POSTGRES_USER: fdar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fdar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_alerting_anomaly_lifecycle.sql:/docker-entrypoint-initdb.d/002_alerting_anomaly_lifecycle.sql:ro
      - ./sql/003_anomaly_lifecycle_audit.sql:/docker-entrypoint-initdb.d/003_anomaly_lifecycle_audit.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdar -d fdar"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: fdar-n8n
    ports:
      - "5678:5678"
    environment:
      TZ: Asia/Nicosia
      GENERIC_TIMEZONE: Asia/Nicosia
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: fdar-postgres-data

  n8n_data:
    external: true
    name: fdar-n8n-data